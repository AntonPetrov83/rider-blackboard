# Plugin metadata
pluginGroup=com.blackboard
pluginName=Blackboard
pluginVersion=0.1.0

# Target platform: JetBrains Rider 2026.2.3.1 (build 262.10968.170) - the locally installed Rider build.
# Available versions: https://www.jetbrains.com/intellij-repository/releases/com/jetbrains/intellij/rider/riderRD/maven-metadata.xml
platformVersion=2026.2.3.1
pluginSinceBuild=262

# Optional: path to a locally installed Rider to use instead of downloading the SDK.
# Set it in ~/.gradle/gradle.properties (machine-specific), e.g.:
# platformLocalPath=C:/Users/<you>/AppData/Local/Programs/Rider
